[project]
name = "Master-Thesis-Repository"
version = "0.0.1"
description = "Generation of synthetic histology H&E patches of breast cancer from RNA-seq data using diffusion models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchmetrics==1.7.1",
    "pytorch-lightning==2.5.1.post0",
    "h5py==3.13.0",
    "matplotlib==3.10.1",
    "numpy==2.2.5",
    "pandas==2.2.3",
    "pillow==11.2.1",
    "pytorch-fid==0.3.0",
    "scipy==1.15.2",
    "tensorboard==2.19.0",
    "scikit-learn==1.6.1",
    "scikit-image==0.25.2",
    "opencv-python==4.11.0.86",
    "pyyaml>=6.0",
    "scanpy>=1.11.5",
    "jupyter>=1.1.1",
    "ipykernel>=7.1.0",
    "cmcrameri>=1.9",
    "webdataset>=1.0.2",
    "dotenv>=0.9.9",
    "lpips>=0.1.4",
    "transformers>=4.48.1",
    "timm>=1.0.14",
    "plotly>=6.5.0",
    "datasets>=4.4.2",
    "mopadi",
    "shapely>=2.1.2",
    "openslide-python>=1.4.3",
    "rtree>=1.4.1",
    "pytest>=7.4.4",
    "lifelines>=0.30.3",
    "gudhi>=3.8.0",
    "giotto-tda>=0.6.0",
    "pot>=0.9.3",
]


[tool.uv]
package = true

[tool.uv.sources]
mopadi = { git = "https://github.com/marabuuu/mopadi.git", rev = "11ccaca94abf95d6fbecdd185b6ef8b7c47ff78d" }
TopoCellGen = { path = "../TopoCellGen"}

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
