# src/drafts/config_archived.yaml
# Superseded experiment configurations.
# Active configs are in src/config.yaml.
#
# Sections:
#   v1 training runs (superseded by v2):
#     brca_pam50_cfg, poc_breast_vs_liver_cfg,
#     poc_breast_vs_liver_cfg_brca_init, poc_brca_lihc_cfg_v2
#
#   128px initial 5 M-sample runs (superseded by 30 M runs):
#     poc_128_1hot, poc_128_1hot_nonorm, poc_128_zero, poc_128_noise, poc_128_rna
#
#   GDA (Genomic Diffusion Adapter) — superseded by CFG backbone approach:
#     poc_breast_vs_liver_gda, genomic_adapter_training
#
#   Smoke tests / dev runs:
#     brca_pam50_cfg_v2_smoketest, brca_pam50_cfg_v2_1hot_smoketest
#
#   Evaluation configs for archived experiments:
#     tfd_separability_generated (cross_attention), segmentation (joint_training)

# ── v1 training runs ─────────────────────────────────────────────────────────

brca_pam50_cfg:
  # ── CFG backbone: PAM50 subtype conditioning on TCGA-BRCA ─────────────────
  # Same architecture as poc_breast_vs_liver_cfg.
  # 5 PAM50 subtypes: LumA (506), LumB (195), Basal (168), Her2 (74), Normal (38)
  # Runs on Titan: 2× gpu48 (RTX 6000 Ada, 48 GiB each).
  training_mode: cfg_backbone

  # ── Data ─────────────────────────────────────────────────────────────────
  zip_dir: ../data/BRCA-tumor-tiles-final
  genomic_feature_dir: ./experiments/20260528_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260528_genomic_features/patient_splits.json
  max_tiles_by_subtype:

  # ── Backbone UNet ─────────────────────────────────────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: true

  # ── CFG ───────────────────────────────────────────────────────────────────
  cfg_dropout: 0.20

  # ── Optimisation ──────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 8          # 4 per GPU on 2× Titan gpu48 (RTX 6000 Ada = 48 GiB, not 70 GiB)
  accumulate_grad_batches: 4   # effective global batch = 32
  total_samples: 200000000
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  backbone_ckpt_path: ""   # train from scratch

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 16
  gpus: [0, 1]
  output_dir: ./experiments/20260529_brca_pam50_cfg_v1
  base_dir: ./experiments/20260529_brca_pam50_cfg_v1
  logdir: ./experiments/20260529_brca_pam50_cfg_v1/gda

poc_breast_vs_liver_cfg:
  # ── CFG backbone: genomic features feed directly into backbone style MLP ──
  # The backbone IS the conditioned denoiser; no separate adapter.
  # CFG dropout replaces features with zeros on cfg_dropout% of batches.
  # Health metric: cond/signal = E[‖backbone(cond) − backbone(null)‖²] must grow.
  # Inference: ε_guided = ε_null + scale * (ε_cond − ε_null)
  training_mode: cfg_backbone

  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ./data/PoC-BRCA-LIHC-tumor-tiles
  genomic_feature_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json
  max_tiles_by_subtype:

  # ── Backbone UNet ────────────────────────────────────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  # Gradient checkpointing disabled: single forward pass + 80GB A100 has
  # enough headroom. Checkpointing saves ~40% memory but costs ~30% compute.
  net_beatgans_gradient_checkpoint: false

  # ── CFG ──────────────────────────────────────────────────────────────────
  cfg_dropout: 0.20   # 20% null batches — standard CFG training ratio

  # ── Optimisation ─────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 16               # 4 per GPU on 4×A100
  accumulate_grad_batches: 2   # effective global batch = 32
  total_samples: 200000000
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # Train from random init — no warm start.
  # A backbone pre-trained without conditioning has no gradient incentive to
  # start using it; conditioning and denoising must co-develop from step 1.
  backbone_ckpt_path: ""

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1, 2, 3]
  output_dir: ./experiments/20260529_poc_brca_lihc_cfg_v1
  base_dir: ./experiments/20260529_poc_brca_lihc_cfg_v1
  logdir: ./experiments/20260529_poc_brca_lihc_cfg_v1/gda

poc_breast_vs_liver_cfg_brca_init:
  # ── CFG backbone rescue: initialize from a BRCA MoPaDi checkpoint ──
  # Same conditioning path as poc_breast_vs_liver_cfg, but backbone weights
  # are warm-started from a pretrained BRCA diffusion checkpoint.
  # This is additive: it does not modify the from-scratch run above.
  training_mode: cfg_backbone

  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ./data/PoC-BRCA-LIHC-tumor-tiles
  genomic_feature_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json
  max_tiles_by_subtype:

  # ── Backbone UNet ────────────────────────────────────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: false

  # ── CFG ──────────────────────────────────────────────────────────────────
  cfg_dropout: 0.20

  # ── Optimisation ─────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 8               # 4 per GPU on 2×48 GB Titan
  accumulate_grad_batches: 4  # effective global batch = 32
  total_samples: 2000000      # fast rescue run; increase later if needed
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # Warm-start from the BRCA-only backbone checkpoint.
  backbone_ckpt_path: ../experiments/20260115_different_models_difficult_to_disentangle/TCGA-BRCA/splitting_mopadi_checkpoint/diffusion_only.ckpt

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1]
  output_dir: ./experiments/20260530_poc_brca_lihc_cfg_brca_init
  base_dir: ./experiments/20260530_poc_brca_lihc_cfg_brca_init
  logdir: ./experiments/20260530_poc_brca_lihc_cfg_brca_init/gda

poc_brca_lihc_cfg_v2:
  training_mode: cfg_backbone

  # ── Data (bulk-saturn NFS) ────────────────────────────────────────────────
  zip_dir: ./data/PoC-BRCA-LIHC-tumor-tiles
  genomic_feature_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json

  # Cap BRCA at 300 tiles/patient (BRCA zips can have 5K–10K tiles; LIHC already small).
  # With 1101 BRCA train patients × 300 tiles + ~290 LIHC train patients × ~120 tiles ≈ 365K train tiles.
  # One epoch ≈ 365K / 8 = 45,600 steps. 2M samples = ~5.5 epochs.
  max_tiles_by_subtype:
    TCGA-BRCA: 300
    TCGA-LIHC: null

  # ── Warm-start: cfg_v1 backbone weights ──────────────────────────────────
  # CfgBackboneLitModel._load_backbone_weights loads only backbone weights and
  # resets style MLP + FiLM layers so they learn from real genomic inputs.
  # Do NOT pass this as ckpt_path to Lightning — use backbone_ckpt_path only.
  backbone_ckpt_path: ./experiments/20260529_poc_brca_lihc_cfg_v1/gda/autoenc/last.ckpt

  # ── Architecture (same as v1 for comparison) ─────────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: true

  # ── CFG ──────────────────────────────────────────────────────────────────
  cfg_dropout: 0.20

  # ── Optimisation ─────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 8                # 4 per GPU × 2 gpu48 (RTX 6000 Ada 48 GiB)
  accumulate_grad_batches: 4   # effective global batch = 32
  total_samples: 2000000       # 2M — ~24h on 2×gpu48 at ~3 it/s; enough to confirm cond/signal
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 100000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 16              # 16 per GPU process (35 cpus/task); overlaps NFS seeks on large zips
  gpus: [0, 1]

  # ── Output ───────────────────────────────────────────────────────────────
  output_dir: ./experiments/20260531_poc_brca_lihc_cfg_v2
  base_dir: ./experiments/20260531_poc_brca_lihc_cfg_v2
  logdir: ./experiments/20260531_poc_brca_lihc_cfg_v2/gda


