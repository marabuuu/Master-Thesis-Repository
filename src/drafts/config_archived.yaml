# ── GDA (Genomic Diffusion Adapter) experiments ──────────────────────────────

poc_breast_vs_liver_gda:
  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ./data/PoC-BRCA-LIHC-tumor-tiles
  genomic_feature_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json
  max_tiles_by_subtype: null           # WeightedRandomSampler handles balance

  # ── Image pre-processing ─────────────────────────────────────────────────
  # Both BRCA and LIHC tiles are natively 512×512 in the zip archives.
  # do_resize=false: no Resize transform added (tiles are already the right size).
  # do_normalize stays true: maps [0,255] → [-1,1] for diffusion training.
  img_size: 512
  do_resize: false
  do_normalize: true

  # ── Backbone UNet architecture (identical to v13) ─────────────────────
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: true

  # ── Adapter architecture (identical to v13) ──────────────────────────
  adapter_base_ch: 64
  adapter_n_tokens: 8
  adapter_token_dim: 256
  adapter_t_dim: 256
  adapter_n_heads: 4

  # ── CFG ──────────────────────────────────────────────────────────────
  cfg_dropout: 0.30

  # ── Joint training — no frozen backbone ──────────────────────────────
  # Backbone trains on its own MSE loss (unconditional denoising).
  # Adapter trains on the residual with backbone stop-grad (see model.py).
  # null_token fixed at zeros — null conditioning = zero-key cross-attention.
  #
  # Backbone from v11 step-8k (backbone has seen ~2.5M samples total from v10+v11,
  # val_loss≈0.032 — already reconstructs tissue well at t=750). Adapter reinit.
  freeze_backbone: false
  backbone_ckpt_path: ./experiments/20260529_poc_brca_lihc_gda_v11/gda/autoenc/last.ckpt
  reinit_adapter: true
  delta_encouragement_weight: 0.05

  # Bootstrap loss: breaks encoder-collapse deadlock by giving the genomic encoder
  # a direct gradient path independent of the cross-attention.
  # MSE(recon_head(h_prenorm), feats) — forces patient-specific token directions.
  # Weight 1.0: equal to denoising MSE to ensure encoder diversifies early.
  genomic_recon_weight: 1.0

  # ── Optimisation ─────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  adapter_lr: 3.0e-4
  batch_size: 16                     # 4 per GPU on 4×A100 (DGX)
  accumulate_grad_batches: 2         # effective global batch = 32
  total_samples: 200000000
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ──────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  steps_per_epoch: 5000
  reconstruct_every_samples: 200000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1, 2, 3]

  # ── Output — v12: genomic reconstruction loss + all fixes 2026-05-29 ─────
  # Key changes vs v11:
  #   genomic_recon_weight=1.0  — breaks encoder-collapse deadlock
  #   t_vis=750 in sample grid  — proper backbone generation test (5% signal)
  #   _log_ddim_samples errors now visible in SLURM log
  #   loss/backbone + loss/adapter logged separately
  #   cond/null_magnitude logged
  output_dir: ./experiments/20260529_poc_brca_lihc_gda_v12
  base_dir: ./experiments/20260529_poc_brca_lihc_gda_v12
  logdir: ./experiments/20260529_poc_brca_lihc_gda_v12/gda

genomic_adapter_training:
  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ../data/BRCA-tumor-tiles-final
  genomic_feature_dir: ./experiments/20260424_genomic_counterfactual_loss_72h/genomic_h5
  patient_splits_path: ./experiments/20260424_genomic_counterfactual_loss_72h/patient_splits.json
  max_tiles_by_subtype:  # null = no cap; subtype balance handled by WeightedRandomSampler

  # ── Backbone UNet architecture (same as v11/v12 for comparability) ───────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  # Gradient checkpointing: safe to enable in GDA (single-forward, no dual-pass conflict)
  net_beatgans_gradient_checkpoint: true

  # ── Adapter architecture ─────────────────────────────────────────────────
  adapter_base_ch: 64          # encoder levels: 64 → 128 → 256 channels
  adapter_n_tokens: 8          # genomic token sequence length
  adapter_token_dim: 256       # cross-attention token dimension
  adapter_t_dim: 256           # sinusoidal timestep embedding dim
  adapter_n_heads: 4           # attention heads in adapter cross-attention

  # ── CFG ──────────────────────────────────────────────────────────────────
  # 15 % null dropout: enough for CFG at inference while giving the adapter
  # ~85 % of batches with real genomic tokens during early training.
  cfg_dropout: 0.15

  # ── Optimisation — two separate LRs ─────────────────────────────────────
  backbone_lr: 1.0e-4          # AdamW LR for backbone UNet
  adapter_lr:  3.0e-4          # AdamW LR for adapter + genomic encoder (higher: learns faster)

  # ── Loss design (v15 — frozen backbone) ─────────────────────────────────
  # freeze_backbone: backbone is loaded from v13 epoch-13 checkpoint and fully
  #   frozen. Only adapter + genomic encoder + null_token receive gradients.
  #   Eliminates backbone–adapter competition (root cause of v14 re-collapse).
  # delta_encouragement_weight: 10× stronger than v14 (1e-2 vs 1e-3) to push
  #   guidance_delta growth against the now-stable backbone.
  freeze_backbone: true
  split_backbone_adapter_loss: false   # irrelevant with frozen backbone
  delta_encouragement_weight: 1.0e-2
  batch_size: 16               # global batch / 4 GPUs = 4 per GPU
  accumulate_grad_batches: 2   # effective global batch = 32
  total_samples: 20000000      # 20M → ~625k adapter gradient steps at eff. batch 32
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ──────────────────────────────────────────────
  val_every_steps: 5000
  limit_val_batches: 100
  save_every_samples: 200000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  steps_per_epoch: 5000
  reconstruct_every_samples: 200000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1, 2, 3]

  # ── Output ───────────────────────────────────────────────────────────────
  # v15: frozen backbone from v13 epoch-13 (225k steps, healthy weights).
  #   Adapter trains on pure residual; backbone never changes.
  output_dir: ./experiments/20260526_gda_v15
  base_dir: ./experiments/20260526_gda_v15
  resume_from: ./experiments/20260517_gda_v13/gda/autoenc/epoch=13-step=225000-ema-reset.ckpt


