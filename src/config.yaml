mopadi_genomic_crossattn:
  csv_path: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  zip_dir: ../data/BRCA-tumor-tiles-corrected
  genomic_feature_dir: ./experiments/20260424_genomic_counterfactual_loss_72h/genomic_h5
  patient_splits_path: ./experiments/20260424_genomic_counterfactual_loss_72h/patient_splits.json
  max_tiles_by_subtype:
    LumA: 45
    LumB: 120
    Basal: 135
    Her2: 300
    Normal: null
  img_size: 512
  net_ch: 128
  net_ch_mult:
  - 1
  - 1
  - 2
  - 2
  - 4
  - 4
  net_attn:
  - 16
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  cross_attention:
    heads: 4
    dim_per_head: 64
    patch_size: 16
  lr: 0.0001
  unet_lr: 1.0e-4
  cross_attn_lr: 1.5e-4
  # High-t genomic-guided loss: both conditioned and shuffled passes have gradients so
  # the model is explicitly pushed to use conditioning at high noise levels.
  # λ=0.3 keeps the high-t term from dominating the L1 loss; high-t outputs looking like
  # blurry class averages ("mean-tile") is *expected* — that is the class prior at t≈T.
  genomic_guided_loss_weight: 0.3
  compute_high_t_loss_during_training: true
  genomic_guided_high_t_frac: 0.8
  n_tiles_per_bag: 1               # 1 tile/patient: 3 CF passes × ~19 GB = 57 GB fits without checkpointing; genomic vector is per-patient so bag averaging adds no signal
  batch_size: 4
  accumulate_grad_batches: 2
  total_samples: 2500000
  steps_per_epoch: 5000
  save_every_samples: 80000
  reconstruct_every_samples: 100000
  sample_size: 8
  net_beatgans_gradient_checkpoint: false  # not needed: n_tiles_per_bag=1 keeps 3 CF passes × ~19 GB = ~57 GB well within 80 GB
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true
  val_every_steps: 5000
  limit_val_batches: 100
  seed: 42
  num_workers: 24
  gpus:
  - 0
  - 1
  - 2
  - 3
  base_dir: ./experiments/20260502_genomic_crossattn_v5
  save_top_k: 3
  out_dir: ./experiments/20260502_genomic_crossattn_v5/train
  checkpoint_dir: ./experiments/20260502_genomic_crossattn_v5/checkpoints
  logdir: ./experiments/20260502_genomic_crossattn_v5/logs
  tensorboard_dir: ./experiments/20260502_genomic_crossattn_v5/tensorboard
  sample_dir: ./experiments/20260502_genomic_crossattn_v5/samples
  reconstructions_dir: ./experiments/20260502_genomic_crossattn_v5/reconstructions
  # Counterfactual conditioning gap loss (softplus; effective margin ≈ temperature)
  counterfactual_loss_weight: 0.05
  counterfactual_temperature: 0.5
  counterfactual_every_n_steps: 1
  counterfactual_warmup_steps: 5000  # longer warmup for stable conditioning ramp with bag mode
  # Genomic reconstruction loss: MSE from pooled UNet bottleneck → genomic vector.
  # Provides a conditioning gradient at t=0 (clean image), complementing the high-t loss.
  genomic_recon_weight: 0.05
  # Composite checkpoint: saves best ckpt by (loss/val - alpha * cond/gap_norm)
  # instead of loss/val alone, so a conditioning-collapsed model is not selected.
  use_composite_metric_checkpoint: true
  composite_alpha: 1.0

training_stats:
  logdir: ./experiments/20260502_genomic_crossattn_v5
  output_dir: ./experiments/20260502_genomic_crossattn_v5/training_stats
