  metadata_csv: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  classes:
  - Basal
  - LumA

  max_tiles_by_subtype:
    LumA: 45
    LumB: 120
    Basal: 135
    Her2: 300
    Normal: null
  masks_dir: ./experiments/tfd_separability/masks
  auto_segment: true
  force_resegment: false
  num_classes: 32
  weights_dataset: TCGA
  device: null
  batch_size: 4
  grouping_json: null
  use_alpha_complex: true
  n_landscape_bins: 100
  n_landscape_layers: 1
  min_cells_per_image: 3
  compute_noise_floor: true
  n_noise_floor_splits: 5
  output_dir: ./experiments/tfd_separability/results_basal_luma
  save_heatmap: true
  figsize: null

tfd_separability_viz:
  # ── Input ─────────────────────────────────────────────────────────────────
  results_json: ./experiments/20260420_tfd_separability/results_all_subtypes/tfd_separability_results.json
  masks_dir: ./experiments/20260420_tfd_separability/masks
  metadata_csv: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  classes: null
  output_dir: ./experiments/20260420_tfd_separability/plots

  # ── Plots to generate ─────────────────────────────────────────────────────
  plots:
    #- radar_contributions     # radar/spider chart with blended subtype colours
    #- channel_contributions   # per-channel TFD heatmaps (absolute + relative)
    #- cell_type_boxplots      # pixel-fraction boxplots per subtype
    - ternary_composition     # epithelium-immune-connective triangle plot
    - nn_distance_violins     # intra-type NN distance violins (spatial clustering)
    - cross_type_proximity    # cross-cell-type NN distance heatmaps (spatial interface)

  # ── Tile sampling ──────────────────────────────────────────────────────────
  max_tiles_per_subtype: 2000   # cap for boxplots + ternary (fast pixel ops)
  max_tiles_spatial: 500        # cap for spatial NN plots (connected components, slower)
  include_background: false
  seed: 42

  # ── Styling (Crameri scientific colour maps) ──────────────────────────────
  cmap_categorical: romaO       # subtype colours (radar, ternary)
  cmap_cell_types: batlow       # cell-type colours in boxplots + NN violins
  cmap_heatmap: lajolla         # sequential colourmap for all heatmaps
  figsize_radar: null           # null = auto (9x9 square)
  figsize_heatmap: null         # null = auto
  figsize_boxplot: null         # null = auto
  figsize_ternary: null         # null = auto (9x8.5)
  figsize_nn_violins: null      # null = auto (same layout as boxplots)
  figsize_proximity: null       # null = auto (5 panels x 6x6 matrix)
  dpi: 200

