  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 16
  gpus: [0, 1, 2, 3]

  # ── Output ───────────────────────────────────────────────────────────────
  output_dir: ./experiments/20260621_brca_pam50_cfg_v2_1hot_256
  base_dir: ./experiments/20260621_brca_pam50_cfg_v2_1hot_256
  logdir: ./experiments/20260621_brca_pam50_cfg_v2_1hot_256/gda

