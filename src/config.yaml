# ── PoC: GDA v13 on BRCA vs LIHC (2026-05-24) ────────────────────────────────────────────
# Proof-of-concept: binary breast vs liver discrimination.
# Same architecture as v13 (BRCA PAM50) — zero training-code changes.
#
# Key differences from v13:
#   zip_dir      → combined symlink dir (BRCA 512px + LIHC 256px tiles)
#   do_resize    → true: upsizes LIHC tiles 256→512 at load time (BRCA unchanged)
#   genomic_*    → PoC gene selection (cohort-discriminative, no PAM50 forcing)
#   subtype_col  → 'cohort' (TCGA-BRCA / TCGA-LIHC); WeightedRandomSampler
#                  auto-balances the ~7.8× BRCA/LIHC tile-count imbalance
#   total_samples → 5M (binary task; 4× faster than 20M PAM50 run)
#   contrastive_weight → 0.01 (SupCon still works with 2 classes)
#
# Hardware: 2×gpu48 on titan (503 GB RAM, 70 CPUs)
#   batch_size: 8 → 4 per GPU  (same per-GPU footprint as DGX v13 at 4/GPU)
#   accumulate_grad_batches: 4 → effective global batch = 32 (unchanged)
#   ~2× slower than 4-GPU DGX run; ~2–3 days for 5M samples
poc_breast_vs_liver_gda:
  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ./data/PoC-BRCA-LIHC-tumor-tiles
  genomic_feature_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json
  max_tiles_by_subtype: null           # WeightedRandomSampler handles balance

  # ── Image pre-processing ─────────────────────────────────────────────────
  # LIHC tiles are 256×256; BRCA tiles are 512×512.
  # do_resize=true upsamples LIHC to img_size=512 at load time (bilinear).
  # do_normalize stays true: maps [0,255] → [-1,1] for diffusion training.
  img_size: 512
  do_resize: true
  do_normalize: true

  # ── Backbone UNet architecture (identical to v13) ─────────────────────
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: true

  # ── Adapter architecture (identical to v13) ──────────────────────────
  adapter_base_ch: 64
  adapter_n_tokens: 8
  adapter_token_dim: 256
  adapter_t_dim: 256
  adapter_n_heads: 4

  # ── CFG ──────────────────────────────────────────────────────────────
  cfg_dropout: 0.15

  # ── Delta encouragement loss ─────────────────────────────────────────
  # −lambda * log(guidance_delta + ε) pushes the adapter to produce non-zero Δε.
  # v1 had delta_encouragement_weight=0.0 (off) → guidance_delta never emerged.
  # 5e-3 is 5× the PAM50 v14 value (1e-3 was too weak there); starting from
  # scratch so we can afford a stronger push.
  delta_encouragement_weight: 5.0e-3

  # ── Contrastive loss ─────────────────────────────────────────────────
  contrastive_weight: 0.01           # SupCon works with 2 classes (BRCA vs LIHC)
  contrastive_temp: 0.1

  # ── Optimisation ─────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  adapter_lr: 3.0e-4
  batch_size: 16                     # 4 per GPU on 4×A100 (DGX)
  accumulate_grad_batches: 2         # effective global batch = 32
  total_samples: 5000000             # binary task; ~1–1.5 days on 4×A100
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ──────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  steps_per_epoch: 5000
  reconstruct_every_samples: 200000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1, 2, 3]

  # ── Output ───────────────────────────────────────────────────────────
  output_dir: ./experiments/20260526_poc_brca_lihc_gda_v2
  base_dir: ./experiments/20260526_poc_brca_lihc_gda_v2
  logdir: ./experiments/20260526_poc_brca_lihc_gda_v2/logs

# ── v13: Genomic Diffusion Adapter — joint from-scratch training (2026-05-17) ──────────────
# Architecture: full MoPaDi backbone UNet + lightweight adapter UNet (~6M params).
#   Backbone always receives cond=zeros → learns unconditional denoising.
#   Adapter receives (x_t, t, g_tokens) → learns genomic correction Δε.
#   ε_pred = ε_backbone + Δε_adapter.  Loss: MSE(ε_pred, noise).
#
# Key advantage over v11/v12:
#   The backbone NEVER sees patient genomic features, so it cannot suppress
#   the adapter (v11 failure) and the adapter is the sole conditioning pathway
#   so it cannot be passively ignored (v12 failure).
#
# No pretrained checkpoint — both components initialise from random weights.
# Fully reproducible.
#
# Health metric: cond/guidance_delta = E[‖Δε_own − Δε_null‖²]
#   Must grow during training. If flat → adapter is not learning conditioning.
#   Independent of backbone (backbone cannot cause this to collapse).
#
# Inference CFG:
#   ε_guided = ε_backbone(x_t, t, 0) + scale * (Δε_own − Δε_null)
genomic_adapter_training:
  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ../data/BRCA-tumor-tiles-final
  genomic_feature_dir: ./experiments/20260424_genomic_counterfactual_loss_72h/genomic_h5
  patient_splits_path: ./experiments/20260424_genomic_counterfactual_loss_72h/patient_splits.json
  max_tiles_by_subtype:  # null = no cap; subtype balance handled by WeightedRandomSampler

  # ── Backbone UNet architecture (same as v11/v12 for comparability) ───────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  # Gradient checkpointing: safe to enable in GDA (single-forward, no dual-pass conflict)
  net_beatgans_gradient_checkpoint: true

  # ── Adapter architecture ─────────────────────────────────────────────────
  adapter_base_ch: 64          # encoder levels: 64 → 128 → 256 channels
  adapter_n_tokens: 8          # genomic token sequence length
  adapter_token_dim: 256       # cross-attention token dimension
  adapter_t_dim: 256           # sinusoidal timestep embedding dim
  adapter_n_heads: 4           # attention heads in adapter cross-attention

  # ── CFG ──────────────────────────────────────────────────────────────────
  # 15 % null dropout: enough for CFG at inference while giving the adapter
  # ~85 % of batches with real genomic tokens during early training.
  cfg_dropout: 0.15

  # ── Optimisation — two separate LRs ─────────────────────────────────────
  backbone_lr: 1.0e-4          # AdamW LR for backbone UNet
  adapter_lr:  3.0e-4          # AdamW LR for adapter + genomic encoder (higher: learns faster)

  # ── Loss design (v15 — frozen backbone) ─────────────────────────────────
  # freeze_backbone: backbone is loaded from v13 epoch-13 checkpoint and fully
  #   frozen. Only adapter + genomic encoder + null_token receive gradients.
  #   Eliminates backbone–adapter competition (root cause of v14 re-collapse).
  # delta_encouragement_weight: 10× stronger than v14 (1e-2 vs 1e-3) to push
  #   guidance_delta growth against the now-stable backbone.
  freeze_backbone: true
  split_backbone_adapter_loss: false   # irrelevant with frozen backbone
  delta_encouragement_weight: 1.0e-2
  batch_size: 16               # global batch / 4 GPUs = 4 per GPU
  accumulate_grad_batches: 2   # effective global batch = 32
  total_samples: 20000000      # 20M → ~625k adapter gradient steps at eff. batch 32
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ──────────────────────────────────────────────
  val_every_steps: 5000
  limit_val_batches: 100
  save_every_samples: 200000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  steps_per_epoch: 5000
  reconstruct_every_samples: 200000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1, 2, 3]

  # ── Output ───────────────────────────────────────────────────────────────
  # v15: frozen backbone from v13 epoch-13 (225k steps, healthy weights).
  #   Adapter trains on pure residual; backbone never changes.
  output_dir: ./experiments/20260526_gda_v15
  base_dir: ./experiments/20260526_gda_v15
  resume_from: ./experiments/20260517_gda_v13/gda/autoenc/epoch=13-step=225000-ema-reset.ckpt

virchow2_umap:
  features_dir: /mnt/copernicus0/mopadi/features/TCGA-BRCA/virchow2-7e9d3eb3
  csv_path: ../dataframes/brca_subtypes.csv
  patient_col: bcr_patient_barcode
  subtype_col: Majority_Subtype_mRNA
