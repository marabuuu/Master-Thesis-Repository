# ══════════════════════════════════
# 4. GENE MANIPULATION
# ══════════════════════════════════
#
# Generates paired tiles: original vs. gene-perturbed conditioning vectors.
# Each manipulation shifts one gene dimension by delta_std standard deviations
# (in StandardScaler space, where 1 unit = 1 std dev of log1p expression).
# The same noise seed is used for original and perturbed tiles so any visual
# difference is attributable solely to the conditioning change.

gene_manipulation:
  run_dir: ./experiments/20260607_brca_pam50_cfg_v2_256/gda
  genomic_h5_dir: ./experiments/20260528_genomic_features/genomic_h5
  gene_list_path: ./experiments/20260528_genomic_features/gene_list.txt
  output_path: ./experiments/20260607_brca_pam50_cfg_v2_256/manipulation_panel.png

  # Patient with a naturally stromal-rich phenotype — POSTN suppression should
  # reduce desmoplastic stroma and reveal the underlying epithelial compartment.
  patient_id: TCGA-E9-A1NF
  n_tiles: 10
  guidance_scale: 5.0
  steps: 20
  seed: 42

  manipulations:
    - gene: POSTN
      delta_std: -3.0     # suppress CAF / desmoplastic stroma marker

  compute_metrics: true
  feature_models:
    - virchow2

# ═══════════════════════════════════════════════════════════
# 5. TRAINING — BRCA PAM50 subtype conditioning (512×512)
# ═══════════════════════════════════════════════════════════

brca_pam50_cfg_v2:
  training_mode: cfg_backbone
  conditioning_type: real

  # ── Data ─────────────────────────────────────────────────────────────────
  zip_dir: ../data/BRCA-tumor-tiles-final
  genomic_feature_dir: ./experiments/20260528_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260528_genomic_features/patient_splits.json

  # Caps calibrated so each subtype contributes ~22K total tiles (≈ Her2's natural
  # ceiling of 74 pts × 300). Normal (38 pts) is left uncapped — too few patients.
  #   LumA  506 pts × 45  = ~22.8K
  #   LumB  195 pts × 120 = ~23.4K
  #   Basal 168 pts × 135 = ~22.7K
  #   Her2   74 pts × 300 = ~22.2K
  #   Normal  38 pts, uncapped → ~41K (all tiles kept)
  max_tiles_by_subtype:
    LumA: 45
    LumB: 120
    Basal: 135
    Her2: 300
    Normal: null

  backbone_ckpt_path: ""   # train from scratch
  val_swap_basal_luma: true  # cond/gap swaps Basal ↔ LumA features (BRCA-specific)
  do_resize: false           # tiles are natively 512×512; no Resize transform needed

  # ── Architecture (512×512, same as brca_pam50_cfg) ────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: false  # A100 80GB — no need

  # ── CFG ──────────────────────────────────────────────────────────────────
  cfg_dropout: 0.15

  # ── Optimisation ─────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 16               # 4 per GPU × 4 A100s
  accumulate_grad_batches: 2   # adjusts val/ckpt cadence; trainer accum=1
  total_samples: 200000000
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 16
  gpus: [0, 1, 2, 3]

  # ── Output ───────────────────────────────────────────────────────────────
  output_dir: ./experiments/20260605_brca_pam50_cfg_v2
  base_dir: ./experiments/20260605_brca_pam50_cfg_v2
  logdir: ./experiments/20260605_brca_pam50_cfg_v2/gda

brca_pam50_cfg_v2_1hot:
  training_mode: cfg_backbone
  conditioning_type: one_hot
  normalize_feats: false

