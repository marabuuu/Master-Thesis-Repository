  output_dir: ./experiments/20260416_mopadi_genomic_scratch/latent_plots
  patient_col: Patient_ID
  label_col: Majority_Subtype_mRNA

mopadi_genomic_crossattn:
  csv_path: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  zip_dir: ../data/BRCA-tumor-tiles-corrected
  genomic_feature_dir: ./experiments/20260424_genomic_counterfactual_loss_72h/genomic_h5
  patient_splits_path: ./experiments/20260424_genomic_counterfactual_loss_72h/patient_splits.json
  max_tiles_by_subtype:
    LumA: 45
    LumB: 120
    Basal: 135
    Her2: 300
    Normal: null
  img_size: 512
  net_ch: 128
  net_ch_mult:
  - 1
  - 1
  - 2
  - 2
  - 4
  - 4
  net_attn:
  - 16
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  lr: 0.0001
  # Counterfactual gap loss — the core conditioning signal.
  # Every cfl_every_n_steps the training loss includes:
  #   lambda * relu(margin - (loss_neg_high_t - loss_ref_high_t))
  # where neg uses cross-subtype shuffled genomic vectors evaluated at t ~ U[T/2, T].
  # λ=0.3 is intentionally aggressive: with fresh weights + scale+shift + learned
  # projection all active from step 1, the model is plastic enough to establish
  # the gap quickly without destabilising image quality.
  cfl_lambda: 0.3
  cfl_margin: 0.005
  cfl_every_n_steps: 4
  n_tiles_per_bag: 1
  batch_size: 16                   # 16 global / 4 GPUs = 4 per GPU
  accumulate_grad_batches: 2       # effective global batch = 32
  total_samples: 2500000
  steps_per_epoch: 5000
  save_every_samples: 80000
  reconstruct_every_samples: 100000
  sample_size: 8
  net_beatgans_gradient_checkpoint: true   # re-enabled: CFL adds a second grad graph per step
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true
  val_every_steps: 5000
  limit_val_batches: 100
  seed: 42
  num_workers: 24
  gpus:
  - 0
  - 1
  - 2
  - 3
  base_dir: ./experiments/20260508_adagn_scaleshift_cfl
  save_top_k: 3
  out_dir: ./experiments/20260508_adagn_scaleshift_cfl/train
  checkpoint_dir: ./experiments/20260508_adagn_scaleshift_cfl/checkpoints
  logdir: ./experiments/20260508_adagn_scaleshift_cfl/logs
  tensorboard_dir: ./experiments/20260508_adagn_scaleshift_cfl/tensorboard
  sample_dir: ./experiments/20260508_adagn_scaleshift_cfl/samples
  reconstructions_dir: ./experiments/20260508_adagn_scaleshift_cfl/reconstructions
  # Composite checkpoint: saves best ckpt by (loss/val - alpha * cond/gap_norm)
  use_composite_metric_checkpoint: true
  composite_alpha: 1.0

training_stats:
  logdir: ./experiments/20260508_adagn_scaleshift_cfl
  output_dir: ./experiments/20260508_adagn_scaleshift_cfl/training_stats
  plots:
  - loss_curves
  - genomic_diagnostics
  #- batch_trajectory
  #- train_val_comparison
  #- early_stopping
  #- summary
  figsize:
  - 16
  - 12
  cmap_categorical: batlowS
  cmap_sequential: batlow

tfd_separability:
  tiles_zip_dir: ../data/BRCA-tumor-tiles-corrected
  metadata_csv: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  classes:
  - Basal
  - LumA

  max_tiles_by_subtype:
    LumA: 45
    LumB: 120
    Basal: 135
    Her2: 300
    Normal: null
  masks_dir: ./experiments/tfd_separability/masks
  auto_segment: true
  force_resegment: false
  num_classes: 32
  weights_dataset: TCGA
  device: null
  batch_size: 4
  grouping_json: null
  use_alpha_complex: true
  n_landscape_bins: 100
  n_landscape_layers: 1
  min_cells_per_image: 3
  compute_noise_floor: true
  n_noise_floor_splits: 5
  output_dir: ./experiments/tfd_separability/results_basal_luma
  save_heatmap: true
  figsize: null

tfd_separability_viz:
  # ── Input ─────────────────────────────────────────────────────────────────
  results_json: ./experiments/20260420_tfd_separability/results_all_subtypes/tfd_separability_results.json
  tiles_dir: ../data/BRCA-tumor-tiles-corrected
  masks_dir: ./experiments/20260420_tfd_separability/masks
  metadata_csv: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  classes: null
  output_dir: ./experiments/20260420_tfd_separability/plots_fast

  # ── Plots to generate ─────────────────────────────────────────────────────
  plots:
    #- radar_contributions     # radar/spider chart with blended subtype colours
    #- channel_contributions   # per-channel TFD heatmaps (absolute + relative)
    #- cell_type_boxplots      # pixel-fraction boxplots per subtype
    - tile_mask_examples       # matched H&E tiles + classification masks
    #- ternary_composition     # epithelium-immune-connective triangle plot
    #- nn_distance_violins     # intra-type NN distance violins (spatial clustering)
    #- cross_type_proximity    # cross-cell-type NN distance heatmaps (spatial interface)
    #- ripley_L_by_subtype     # Scale-dependent clustering (L-function curves)
    #- voronoi_distribution    # Cell dispersion via Voronoi areas
    #- knn_metrics             # kNN connectivity & clustering coefficient

  # ── Tile sampling ──────────────────────────────────────────────────────────
  max_tiles_per_subtype: 2000   # cap for boxplots + ternary (fast pixel ops)
  max_tiles_spatial: 150        # faster spatial pass: fewer tiles per subtype
  ripley_n_bootstrap: 20        # reduce CSR simulations for Ripley L(r) envelopes
  include_background: false
  seed: 42

  # ── Styling (Crameri scientific colour maps) ──────────────────────────────
  cmap_categorical: romaO       # subtype colours (radar, ternary)
  cmap_cell_types: batlow       # cell-type colours in boxplots + NN violins
  cmap_heatmap: lajolla         # sequential colourmap for all heatmaps
  figsize_radar: null           # null = auto (9x9 square)
  figsize_heatmap: null         # null = auto
  figsize_boxplot: null         # null = auto
  figsize_ternary: null         # null = auto (9x8.5)
  figsize_nn_violins: null      # null = auto (same layout as boxplots)
  figsize_proximity: null       # null = auto (5 panels x 6x6 matrix)
  dpi: 200

