# src/config.yaml — active pipeline configuration
# Run: python run_pipeline.py --config src/config.yaml --stage <name>
# Archived/superseded configs: src/drafts/config_archived.yaml

# ═════════════════════════
# 1. DATA PREPROCESSING
# ═════════════════════════

preprocessing:
  zip_dir: ../data/TCGA
  roi_dir: ../data/annotations-BRCA
  save_dir: ../data/BRCA-tumor-tiles-final
  target_mpp: 0.5
  native_slide_mpp: 0.25
  num_workers: 32
  plots: true
  area_threshold: 0.6
  selection_mode: overlap
  annotation_buffer: 0.0

tar_to_tumor_zip:
  # for proof of concept investigation needed
  tar_dir: /mnt/bulk-ganymede/laura/diffusion/data/TCGA-LIHC
  roi_dir: /mnt/copernicus3/PATHOLOGY/others/public/TCGA/TCGA-LIHC-DX-IMGS/annotations-LIHC
  save_dir: ../data/Liver-tumor-tiles-final
  target_mpp: 0.5
  native_slide_mpp: 0.25
  tile_size_px: 256
  num_workers: 8
  area_threshold: 0.6
  selection_mode: overlap
  annotation_buffer: 0.0

downscale_tiles:
  input_dir: ../data/Liver-tumor-tiles-final
  output_dir: ../data/Liver-tumor-tiles-128
  target_size: 128
  num_workers: 18
  compression: stored    # stored = no outer zip compression (PNGs are already compressed internally)

# ═════════════════════════
# 2. FEATURE EXTRACTION
# ═════════════════════════

build_genomic_features:
  csv_path: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  output_dir: ./experiments/20260528_genomic_features
  zip_dir: ../data/BRCA-tumor-tiles-corrected
  gene_selection:
    target_genes: 512
    min_nonzero: 5
    corr_threshold: 0.9
    force_pam50: true
    pam50_path: ../dataframes/PAM50_gene_list.txt
    wanted_subtypes:
    - Basal
    - LumA
  split:
    train: 0.8
    val: 0.1
    test: 0.1
    seed: 42

poc_breast_vs_liver_genomic_features:
  # Gene selection for proof-of-concept BRCA vs LIHC discrimination.
  # Uses the same normalization (log1p + StandardScaler on train split only)
  # as the BRCA training to keep the preprocessing pipeline consistent.
  csv_path: ../dataframes/tcga_RNASeq_BRCA_LIHC.csv
  patient_col: Patient_ID
  subtype_col: cohort                  # 'TCGA-BRCA' or 'TCGA-LIHC'
  output_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features
  gene_selection:
    target_genes: 512
    min_nonzero: 5
    corr_threshold: 0.90
    force_pam50: false                 # PAM50 genes are breast-specific; not useful here
    pam50_path: null
    wanted_subtypes:
    - TCGA-BRCA
    - TCGA-LIHC
  split:
    train: 0.80
    val: 0.10
    test: 0.10
    seed: 42

subtype_classifier:
  mode: evaluate
  features_dir: /mnt/copernicus0/mopadi/features/TCGA-BRCA/virchow2-7e9d3eb3
  patient_splits_path: ./experiments/20260320_joint_training_encoder_only_slurm/patient_splits.json
  max_tiles_per_patient: 100
  seed: 42
  output_dir: ./experiments/20260326_cross_subtype_classifier
  train:
    solver: liblinear
    Cs:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    - 100.0
    cv_folds: 5
    max_iter: 2000
    class_weight: balanced
  evaluate:
    model_path: ./experiments/20260326_cross_subtype_classifier/train/subtype_linear_model.joblib

subtype_classifier_cv:
  features_dir: /mnt/copernicus0/mopadi/features/TCGA-BRCA/virchow2-7e9d3eb3
  label_csv_path: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  output_dir: ./experiments/20260618_subtype_classifier_cv
  max_tiles_per_patient: 100
  seed: 42
  n_folds: 5
  n_bootstrap: 1000
  solver: liblinear
  Cs:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
  - 100.0
  max_iter: 2000
  class_weight: balanced

generated_subtype_eval:
  model_path: ./experiments/20260618_subtype_classifier_cv/final_model/subtype_linear_model.joblib
  cv_summary_path: ./experiments/20260618_subtype_classifier_cv/cv_results/cv_summary.json
  generated_features_dir: ./experiments/20260618_subtype_classifier_cv/generated_virchow2_features
  output_dir: ./experiments/20260618_subtype_classifier_cv/generated_eval

# ═════════════════════════════════════════════════════════
# 3. TRAINING — PoC: BRCA vs LIHC binary discrimination
# ═════════════════════════════════════════════════════════


# ── 512×512 main run (DGX 4×A100, CFG backbone) ──────────────────────────

poc_brca_lihc_cfg_v2_dgx:
  training_mode: cfg_backbone

  # ── Data (bulk-saturn NFS) ────────────────────────────────────────────────
  zip_dir: ./data/PoC-BRCA-LIHC-tumor-tiles
  genomic_feature_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json

  max_tiles_by_subtype:
    TCGA-BRCA: 300
    TCGA-LIHC: null

  backbone_ckpt_path: ./experiments/20260529_poc_brca_lihc_cfg_v1/gda/autoenc/last.ckpt

  # ── Architecture ─────────────────────────────────────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: false  # A100 80GB — no need

  # ── CFG ──────────────────────────────────────────────────────────────────
  cfg_dropout: 0.20

  # ── Optimisation ─────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 16               # 4 per GPU × 4 A100s
  accumulate_grad_batches: 2   # effective global batch = 32
  total_samples: 2000000       # 2M — ~5h on 4×A100 at ~10 it/s
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 100000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 16
  gpus: [0, 1, 2, 3]

  # ── Output ───────────────────────────────────────────────────────────────
  output_dir: ./experiments/20260601_poc_brca_lihc_cfg_v2_dgx
  base_dir: ./experiments/20260601_poc_brca_lihc_cfg_v2_dgx
  logdir: ./experiments/20260601_poc_brca_lihc_cfg_v2_dgx/gda

# ── 128×128 conditioning ablations (30 M samples each) ─────────────────────
