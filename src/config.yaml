  output_dir: ./experiments/20260306_FOXA1_finetuning/encoding
  gene_list_path: ./experiments/20260302_gene_subselection/encoding/gene_list.txt
  target_genes: 512
  min_nonzero: 5
  corr_threshold: 0.9
  force_pam50: true
  pam50_path: ../dataframes/PAM50_gene_list.txt
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA

build_genomic_features:
  csv_path: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  output_dir: ./experiments/20260424_genomic_counterfactual_loss_72h
