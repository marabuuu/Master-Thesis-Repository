preprocessing:
  zip_dir: ../data/TCGA
  roi_dir: ../data/annotations-BRCA
  save_dir: ../data/BRCA-tumor-tiles-corrected
  target_mpp: 0.5
  native_slide_mpp: 0.25
  num_workers: 8
  plots: true
  area_threshold: 0.6
  selection_mode: overlap
  annotation_buffer: 0.0

encoding:
  csv_path: ../dataframes/brca_gene_expression_with_subtypes.csv
  output_dir: ./experiments/20260306_FOXA1_finetuning/encoding
  gene_list_path: ./experiments/20260302_gene_subselection/encoding/gene_list.txt
  target_genes: 512
  min_nonzero: 5
  corr_threshold: 0.9
  force_pam50: true
  pam50_path: ../dataframes/PAM50_gene_list.txt
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA

build_genomic_features:
  csv_path: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  output_dir: ./experiments/20260424_genomic_counterfactual_loss_72h
  zip_dir: ../data/BRCA-tumor-tiles-corrected
  gene_selection:
    target_genes: 512
    min_nonzero: 5
    corr_threshold: 0.9
    force_pam50: true
    pam50_path: ../dataframes/PAM50_gene_list.txt
    wanted_subtypes:
    - Basal
    - LumA
  split:
    train: 0.8
    val: 0.1
    test: 0.1
    seed: 42

visualize_latents:
  latent_dir: ./experiments/20260416_mopadi_genomic_scratch/genomic_h5
  csv_path: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_splits_path: ./experiments/20260416_mopadi_genomic_scratch/patient_splits.json
  output_dir: ./experiments/20260416_mopadi_genomic_scratch/latent_plots
  patient_col: Patient_ID
  label_col: Majority_Subtype_mRNA

mopadi_genomic_crossattn:
  csv_path: ../dataframes/brca_gene_expression_with_subtypes.csv
  patient_col: Patient_ID
  subtype_col: Majority_Subtype_mRNA
  zip_dir: ../data/BRCA-tumor-tiles-corrected
  genomic_feature_dir: ./experiments/20260424_genomic_counterfactual_loss_72h/genomic_h5
  patient_splits_path: ./experiments/20260424_genomic_counterfactual_loss_72h/patient_splits.json
  max_tiles_by_subtype:
    LumA: 45
    LumB: 120
    Basal: 135
    Her2: 300
    Normal: null
  img_size: 512
  net_ch: 128
  net_ch_mult:
  - 1
  - 1
  - 2
  - 2
  - 4
  - 4
  net_attn:
  - 16
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  cross_attention:
    heads: 4
    dim_per_head: 64
    patch_size: 16
  lr: 0.0001
  unet_lr: 5.0e-5
  cross_attn_lr: 1.5e-4
  genomic_guided_loss_weight: 1.0
  genomic_guided_high_t_frac: 0.8
  batch_size: 4
  accumulate_grad_batches: 2
  total_samples: 2500000
  steps_per_epoch: 5000
  save_every_samples: 80000
  reconstruct_every_samples: 100000
  sample_size: 8
  net_beatgans_gradient_checkpoint: false
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true
  val_every_steps: 5000
  limit_val_batches: 100
  seed: 42
  num_workers: 24
  gpus:
  - 0
  - 1
  - 2
  - 3
  base_dir: ./experiments/20260430_genomic_crossattn_v3
  save_top_k: 3
  out_dir: ./experiments/20260430_genomic_crossattn_v3/train
  checkpoint_dir: ./experiments/20260430_genomic_crossattn_v3/checkpoints
  logdir: ./experiments/20260430_genomic_crossattn_v3/logs
  tensorboard_dir: ./experiments/20260430_genomic_crossattn_v3/tensorboard
  sample_dir: ./experiments/20260430_genomic_crossattn_v3/samples
  reconstructions_dir: ./experiments/20260430_genomic_crossattn_v3/reconstructions
  # Counterfactual conditioning gap loss (softplus; effective margin ≈ temperature)
  counterfactual_loss_weight: 1.0
  counterfactual_temperature: 0.5
  counterfactual_every_n_steps: 1
  counterfactual_warmup_steps: 2000
  # Genomic reconstruction loss: MSE from pooled UNet bottleneck → genomic vector
  # Adds one extra forward pass per step; set to 0.0 to disable.
  genomic_recon_weight: 0.05
  # Composite checkpoint: saves best ckpt by (loss/val - alpha * cond/gap_norm)
  # instead of loss/val alone, so a conditioning-collapsed model is not selected.
  use_composite_metric_checkpoint: true
  composite_alpha: 1.0

training_stats:
  logdir: ./experiments/20260430_genomic_crossattn_v3
  output_dir: ./experiments/20260430_genomic_crossattn_v3/training_stats
  plots:
  - loss_curves
  - genomic_diagnostics
  - batch_trajectory
  - train_val_comparison
  - early_stopping
  - summary
  figsize:
  - 16
  - 12
  cmap_categorical: batlowS
  cmap_sequential: batlow

