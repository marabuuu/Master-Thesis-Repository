# ── PoC: GDA v13 on BRCA vs LIHC (2026-05-24) ────────────────────────────────────────────
# Proof-of-concept: binary breast vs liver discrimination.
# Same architecture as v13 (BRCA PAM50) — zero training-code changes.
#
# Key differences from v13:
#   zip_dir      → combined symlink dir (BRCA 512px + LIHC 256px tiles)
#   do_resize    → true: upsizes LIHC tiles 256→512 at load time (BRCA unchanged)
#   genomic_*    → PoC gene selection (cohort-discriminative, no PAM50 forcing)
#   subtype_col  → 'cohort' (TCGA-BRCA / TCGA-LIHC); WeightedRandomSampler
#                  auto-balances the ~7.8× BRCA/LIHC tile-count imbalance
#   total_samples → 5M (binary task; 4× faster than 20M PAM50 run)
#   contrastive_weight → 0.01 (SupCon still works with 2 classes)
#
# Hardware: 2×gpu48 on titan (503 GB RAM, 70 CPUs)
#   batch_size: 8 → 4 per GPU  (same per-GPU footprint as DGX v13 at 4/GPU)
#   accumulate_grad_batches: 4 → effective global batch = 32 (unchanged)
#   ~2× slower than 4-GPU DGX run; ~2–3 days for 5M samples
brca_pam50_cfg:
  # ── CFG backbone: PAM50 subtype conditioning on TCGA-BRCA ─────────────────
  # Same architecture as poc_breast_vs_liver_cfg.
  # 5 PAM50 subtypes: LumA (506), LumB (195), Basal (168), Her2 (74), Normal (38)
  # Runs on Titan: 2× gpu48 (RTX 6000 Ada, 48 GiB each).
  training_mode: cfg_backbone

  # ── Data ─────────────────────────────────────────────────────────────────
  zip_dir: ../data/BRCA-tumor-tiles-final
  genomic_feature_dir: ./experiments/20260528_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260528_genomic_features/patient_splits.json
  max_tiles_by_subtype:

  # ── Backbone UNet ─────────────────────────────────────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: true

  # ── CFG ───────────────────────────────────────────────────────────────────
  cfg_dropout: 0.20

  # ── Optimisation ──────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 8          # 4 per GPU on 2× Titan gpu48 (RTX 6000 Ada = 48 GiB, not 70 GiB)
  accumulate_grad_batches: 4   # effective global batch = 32
  total_samples: 200000000
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  backbone_ckpt_path: ""   # train from scratch

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 16
  gpus: [0, 1]
  output_dir: ./experiments/20260529_brca_pam50_cfg_v1
  base_dir: ./experiments/20260529_brca_pam50_cfg_v1
  logdir: ./experiments/20260529_brca_pam50_cfg_v1/gda

poc_breast_vs_liver_cfg:
  # ── CFG backbone: genomic features feed directly into backbone style MLP ──
  # The backbone IS the conditioned denoiser; no separate adapter.
  # CFG dropout replaces features with zeros on cfg_dropout% of batches.
  # Health metric: cond/signal = E[‖backbone(cond) − backbone(null)‖²] must grow.
  # Inference: ε_guided = ε_null + scale * (ε_cond − ε_null)
  training_mode: cfg_backbone

  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ./data/PoC-BRCA-LIHC-tumor-tiles
  genomic_feature_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json
  max_tiles_by_subtype:

  # ── Backbone UNet ────────────────────────────────────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  # Gradient checkpointing disabled: single forward pass + 80GB A100 has
  # enough headroom. Checkpointing saves ~40% memory but costs ~30% compute.
  net_beatgans_gradient_checkpoint: false

  # ── CFG ──────────────────────────────────────────────────────────────────
  cfg_dropout: 0.20   # 20% null batches — standard CFG training ratio

  # ── Optimisation ─────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 16               # 4 per GPU on 4×A100
  accumulate_grad_batches: 2   # effective global batch = 32
  total_samples: 200000000
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # Train from random init — no warm start.
  # A backbone pre-trained without conditioning has no gradient incentive to
  # start using it; conditioning and denoising must co-develop from step 1.
  backbone_ckpt_path: ""

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1, 2, 3]
  output_dir: ./experiments/20260529_poc_brca_lihc_cfg_v1
  base_dir: ./experiments/20260529_poc_brca_lihc_cfg_v1
  logdir: ./experiments/20260529_poc_brca_lihc_cfg_v1/gda

poc_breast_vs_liver_cfg_brca_init:
  # ── CFG backbone rescue: initialize from a BRCA MoPaDi checkpoint ──
  # Same conditioning path as poc_breast_vs_liver_cfg, but backbone weights
  # are warm-started from a pretrained BRCA diffusion checkpoint.
  # This is additive: it does not modify the from-scratch run above.
  training_mode: cfg_backbone

  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ./data/PoC-BRCA-LIHC-tumor-tiles
  genomic_feature_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json
  max_tiles_by_subtype:

  # ── Backbone UNet ────────────────────────────────────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: false

  # ── CFG ──────────────────────────────────────────────────────────────────
  cfg_dropout: 0.20

  # ── Optimisation ─────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 8               # 4 per GPU on 2×48 GB Titan
  accumulate_grad_batches: 4  # effective global batch = 32
  total_samples: 2000000      # fast rescue run; increase later if needed
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # Warm-start from the BRCA-only backbone checkpoint.
  backbone_ckpt_path: /mnt/bulk-saturn/maralampert/genhist/experiments/20260115_different_models_difficult_to_disentangle/TCGA-BRCA/splitting_mopadi_checkpoint/diffusion_only.ckpt

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1]
  output_dir: ./experiments/20260530_poc_brca_lihc_cfg_brca_init
  base_dir: ./experiments/20260530_poc_brca_lihc_cfg_brca_init
  logdir: ./experiments/20260530_poc_brca_lihc_cfg_brca_init/gda

# ── PoC v2: CFG backbone on local Weka FS, 4×H100, 2-day run (2026-05-31) ────────────────────
# Simpler than GDA: backbone receives genomic features directly with CFG dropout.
# Uses CfgBackboneLitModel (no adapter), warm-started from GDA last.ckpt backbone weights.
# Data is on local Weka FS (InfiniBand), not bulk-saturn — fixes the I/O bottleneck.
# BRCA capped at 300 tiles/patient → ~300K train tiles → manageable epoch size.
poc_brca_lihc_cfg_v2:
  # ── Data (Weka FS — fast random access over InfiniBand) ─────────────────
  zip_dir: /data/cat/ws/mala059b-rna2wsi/data/PoC-BRCA-LIHC-local
  genomic_feature_dir: /data/cat/ws/mala059b-rna2wsi/experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: /data/cat/ws/mala059b-rna2wsi/experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json

  # Cap BRCA at 300 tiles/patient (BRCA zips can have 5K–10K tiles; LIHC already small).
  # With 1101 BRCA train patients × 300 tiles + ~290 LIHC train patients × ~120 tiles ≈ 365K train tiles.
  # One epoch ≈ 365K / 16 = 22,800 steps. 5M samples = ~16 epochs — much more manageable.
  max_tiles_by_subtype:
    TCGA-BRCA: 300
    TCGA-LIHC: null

  # ── Warm-start: GDA run backbone (320K unconditional denoising steps) ───
  # CfgBackboneLitModel._load_backbone_weights loads only backbone weights and
  # resets style MLP + FiLM layers so they learn from real genomic inputs.
  # Do NOT pass this as ckpt_path to Lightning — GDA architecture is incompatible.
  backbone_ckpt_path: /data/cat/ws/mala059b-rna2wsi/experiments/20260529_poc_brca_lihc_cfg_v1/gda/autoenc/last.ckpt

  # ── Architecture (same as v1 for comparison) ─────────────────────────────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: true

  # ── CFG ──────────────────────────────────────────────────────────────────
  cfg_dropout: 0.20

  # ── Optimisation ─────────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  batch_size: 16               # 4 per GPU × 4 H100s
  accumulate_grad_batches: 2   # effective global batch = 32
  total_samples: 2000000       # 2M — fits comfortably in 20h; enough to confirm cond/signal
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ───────────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 100000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  reconstruct_every_samples: 50000
  sample_size: 8
  seed: 42
  num_workers: 8               # 8 workers/GPU; Weka FS handles concurrent reads well
  gpus: [0, 1, 2, 3]

  # ── Output ───────────────────────────────────────────────────────────────
  output_dir: /data/cat/ws/mala059b-rna2wsi/experiments/20260531_poc_brca_lihc_cfg_v2
  base_dir: /data/cat/ws/mala059b-rna2wsi/experiments/20260531_poc_brca_lihc_cfg_v2

poc_breast_vs_liver_gda:
  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ./data/PoC-BRCA-LIHC-tumor-tiles
  genomic_feature_dir: ./experiments/20260524_poc_breast_vs_liver_genomic_features/genomic_h5
  patient_splits_path: ./experiments/20260524_poc_breast_vs_liver_genomic_features/patient_splits.json
  max_tiles_by_subtype: null           # WeightedRandomSampler handles balance

  # ── Image pre-processing ─────────────────────────────────────────────────
  # Both BRCA and LIHC tiles are natively 512×512 in the zip archives.
  # do_resize=false: no Resize transform added (tiles are already the right size).
  # do_normalize stays true: maps [0,255] → [-1,1] for diffusion training.
  img_size: 512
  do_resize: false
  do_normalize: true

  # ── Backbone UNet architecture (identical to v13) ─────────────────────
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  net_beatgans_gradient_checkpoint: true

  # ── Adapter architecture (identical to v13) ──────────────────────────
  adapter_base_ch: 64
  adapter_n_tokens: 8
  adapter_token_dim: 256
  adapter_t_dim: 256
  adapter_n_heads: 4

  # ── CFG ──────────────────────────────────────────────────────────────
  cfg_dropout: 0.30

  # ── Joint training — no frozen backbone ──────────────────────────────
  # Backbone trains on its own MSE loss (unconditional denoising).
  # Adapter trains on the residual with backbone stop-grad (see model.py).
  # null_token fixed at zeros — null conditioning = zero-key cross-attention.
  #
  # Backbone from v11 step-8k (backbone has seen ~2.5M samples total from v10+v11,
  # val_loss≈0.032 — already reconstructs tissue well at t=750). Adapter reinit.
  freeze_backbone: false
  backbone_ckpt_path: ./experiments/20260529_poc_brca_lihc_gda_v11/gda/autoenc/last.ckpt
  reinit_adapter: true
  delta_encouragement_weight: 0.05

  # Bootstrap loss: breaks encoder-collapse deadlock by giving the genomic encoder
  # a direct gradient path independent of the cross-attention.
  # MSE(recon_head(h_prenorm), feats) — forces patient-specific token directions.
  # Weight 1.0: equal to denoising MSE to ensure encoder diversifies early.
  genomic_recon_weight: 1.0

  # ── Optimisation ─────────────────────────────────────────────────────
  backbone_lr: 1.0e-4
  adapter_lr: 3.0e-4
  batch_size: 16                     # 4 per GPU on 4×A100 (DGX)
  accumulate_grad_batches: 2         # effective global batch = 32
  total_samples: 200000000
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ──────────────────────────────────────────
  val_every_steps: 2000
  limit_val_batches: 100
  save_every_samples: 50000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  steps_per_epoch: 5000
  reconstruct_every_samples: 200000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1, 2, 3]

  # ── Output — v12: genomic reconstruction loss + all fixes 2026-05-29 ─────
  # Key changes vs v11:
  #   genomic_recon_weight=1.0  — breaks encoder-collapse deadlock
  #   t_vis=750 in sample grid  — proper backbone generation test (5% signal)
  #   _log_ddim_samples errors now visible in SLURM log
  #   loss/backbone + loss/adapter logged separately
  #   cond/null_magnitude logged
  output_dir: ./experiments/20260529_poc_brca_lihc_gda_v12
  base_dir: ./experiments/20260529_poc_brca_lihc_gda_v12
  logdir: ./experiments/20260529_poc_brca_lihc_gda_v12/gda

# ── v13: Genomic Diffusion Adapter — joint from-scratch training (2026-05-17) ──────────────
# Architecture: full MoPaDi backbone UNet + lightweight adapter UNet (~6M params).
#   Backbone always receives cond=zeros → learns unconditional denoising.
#   Adapter receives (x_t, t, g_tokens) → learns genomic correction Δε.
#   ε_pred = ε_backbone + Δε_adapter.  Loss: MSE(ε_pred, noise).
#
# Key advantage over v11/v12:
#   The backbone NEVER sees patient genomic features, so it cannot suppress
#   the adapter (v11 failure) and the adapter is the sole conditioning pathway
#   so it cannot be passively ignored (v12 failure).
#
# No pretrained checkpoint — both components initialise from random weights.
# Fully reproducible.
#
# Health metric: cond/guidance_delta = E[‖Δε_own − Δε_null‖²]
#   Must grow during training. If flat → adapter is not learning conditioning.
#   Independent of backbone (backbone cannot cause this to collapse).
#
# Inference CFG:
#   ε_guided = ε_backbone(x_t, t, 0) + scale * (Δε_own − Δε_null)
genomic_adapter_training:
  # ── Data ────────────────────────────────────────────────────────────────
  zip_dir: ../data/BRCA-tumor-tiles-final
  genomic_feature_dir: ./experiments/20260424_genomic_counterfactual_loss_72h/genomic_h5
  patient_splits_path: ./experiments/20260424_genomic_counterfactual_loss_72h/patient_splits.json
  max_tiles_by_subtype:  # null = no cap; subtype balance handled by WeightedRandomSampler

  # ── Backbone UNet architecture (same as v11/v12 for comparability) ───────
  img_size: 512
  net_ch: 128
  net_ch_mult: [1, 1, 2, 2, 4, 4]
  net_attn: [16]
  net_num_res_blocks: 2
  style_ch: 512
  feat_dim: 512
  T: 1000
  T_eval: 20
  # Gradient checkpointing: safe to enable in GDA (single-forward, no dual-pass conflict)
  net_beatgans_gradient_checkpoint: true

  # ── Adapter architecture ─────────────────────────────────────────────────
  adapter_base_ch: 64          # encoder levels: 64 → 128 → 256 channels
  adapter_n_tokens: 8          # genomic token sequence length
  adapter_token_dim: 256       # cross-attention token dimension
  adapter_t_dim: 256           # sinusoidal timestep embedding dim
  adapter_n_heads: 4           # attention heads in adapter cross-attention

  # ── CFG ──────────────────────────────────────────────────────────────────
  # 15 % null dropout: enough for CFG at inference while giving the adapter
  # ~85 % of batches with real genomic tokens during early training.
  cfg_dropout: 0.15

  # ── Optimisation — two separate LRs ─────────────────────────────────────
  backbone_lr: 1.0e-4          # AdamW LR for backbone UNet
  adapter_lr:  3.0e-4          # AdamW LR for adapter + genomic encoder (higher: learns faster)

  # ── Loss design (v15 — frozen backbone) ─────────────────────────────────
  # freeze_backbone: backbone is loaded from v13 epoch-13 checkpoint and fully
  #   frozen. Only adapter + genomic encoder + null_token receive gradients.
  #   Eliminates backbone–adapter competition (root cause of v14 re-collapse).
  # delta_encouragement_weight: 10× stronger than v14 (1e-2 vs 1e-3) to push
  #   guidance_delta growth against the now-stable backbone.
  freeze_backbone: true
  split_backbone_adapter_loss: false   # irrelevant with frozen backbone
  delta_encouragement_weight: 1.0e-2
  batch_size: 16               # global batch / 4 GPUs = 4 per GPU
  accumulate_grad_batches: 2   # effective global batch = 32
  total_samples: 20000000      # 20M → ~625k adapter gradient steps at eff. batch 32
  ema_decay: 0.9999
  grad_clip: 1.0
  fp16: false
  bf16: true

  # ── Logging / checkpointing ──────────────────────────────────────────────
  val_every_steps: 5000
  limit_val_batches: 100
  save_every_samples: 200000
  save_top_k: 3
  monitor_metric: loss/val_ckpt
  steps_per_epoch: 5000
  reconstruct_every_samples: 200000
  sample_size: 8
  seed: 42
  num_workers: 24
  gpus: [0, 1, 2, 3]

  # ── Output ───────────────────────────────────────────────────────────────
  # v15: frozen backbone from v13 epoch-13 (225k steps, healthy weights).
  #   Adapter trains on pure residual; backbone never changes.
  output_dir: ./experiments/20260526_gda_v15
  base_dir: ./experiments/20260526_gda_v15
  resume_from: ./experiments/20260517_gda_v13/gda/autoenc/epoch=13-step=225000-ema-reset.ckpt

virchow2_umap:
  features_dir: /mnt/copernicus0/mopadi/features/TCGA-BRCA/virchow2-7e9d3eb3
  csv_path: ../dataframes/brca_subtypes.csv
  patient_col: bcr_patient_barcode
  subtype_col: Majority_Subtype_mRNA
